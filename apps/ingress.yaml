apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pg-api
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  rules:
    - host: acta-pg-api.0-0-0-0.sslip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: acta-pg-api
                port:
                  number: 8080
  tls:
    - hosts:
        - acta-pg-api.0-0-0-0.sslip.io
      secretName: pg-api-tls
---
