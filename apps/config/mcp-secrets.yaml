apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret

metadata:
  name: acta-mcp-secrets

spec:
  hostAPI: https://app.infisical.com/api
  resyncInterval: 60

  authentication:
    universalAuth:
      credentialsRef:
        secretName: infisical-universal-auth
        secretNamespace: acta-prod
      secretsScope:
        projectId: 051dcf5e-00ed-4d46-8b36-baad0a621f5d
        envSlug: prod
        secretsPath: /mcp
        recursive: false

  managedKubeSecretReferences:
    - secretName: acta-mcp-env
      secretNamespace: acta-prod
      creationPolicy: Owner

      template:
        includeAllSecrets: false
        data:
          ACTA_MCP_API_KEY: "{{ .ACTA_MCP_API_KEY.Value }}"
          DATABASE_URL: "{{ .DATABASE_URL.Value }}"
          MONGODB_URI: "{{ .MONGODB_URI.Value }}"
          GEMINI_API_KEY: "{{ .GEMINI_API_KEY.Value }}"
          QDRANT_CLUSTER_ENDPOINT: "{{ .QDRANT_CLUSTER_ENDPOINT.Value }}"
          QDRANT_API_KEY: "{{ .QDRANT_API_KEY.Value }}"
          CLOUDINARY_CLOUD_NAME: "{{ .CLOUDINARY_CLOUD_NAME.Value }}"
          CLOUDINARY_API_KEY: "{{ .CLOUDINARY_API_KEY.Value }}"
          CLOUDINARY_API_SECRET: "{{ .CLOUDINARY_API_SECRET.Value }}"