apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: acta-fcm-api-secrets
spec:
  hostAPI: https://app.infisical.com/api
  resyncInterval: 60
  authentication:
    universalAuth:
      credentialsRef:
        secretName: infisical-universal-auth
        secretNamespace: acta-prod
      secretsScope:
        projectId: 051dcf5e-00ed-4d46-8b36-baad0a621f5d
        envSlug: prod
        secretsPath: /fcm-api
        recursive: false
  managedKubeSecretReferences:
    - secretName: acta-fcm-api-env
      secretNamespace: acta-prod
      creationPolicy: Owner
      template:
        includeAllSecrets: false
        data:
          DB_URL: "{{ .DB_URL.Value }}"
          ACTA_PG_API_URL: "{{ .ACTA_PG_API_URL.Value }}"
          INTERNAL_API_TOKEN: "{{ .INTERNAL_API_TOKEN.Value }}"
          FIREBASE_PROJECT_ID: "{{ .FIREBASE_PROJECT_ID.Value }}"