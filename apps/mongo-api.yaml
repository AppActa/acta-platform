apiVersion: apps/v1
kind: Deployment

metadata:
  name: acta-mongo-api
  annotations:
    # reinicia os pods quando o infisical atualizar os secrets
    secrets.infisical.com/auto-reload: "true"
  labels:
    app.kubernetes.io/name: acta-mongo-api
    app.kubernetes.io/part-of: acta

spec:
  replicas: 1
  revisionHistoryLimit: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: acta-mongo-api

  template:
    metadata:
      labels:
        app.kubernetes.io/name: acta-mongo-api
        app.kubernetes.io/part-of: acta

    spec:
      containers:
        - name: acta-mongo-api
          image: ghcr.io/appacta/acta-mongo-api:sha-695a7ddd23c317234cc0c3d447ecfdcb5504b3eb
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8081
              protocol: TCP

          envFrom:
            - secretRef:
                name: acta-mongo-api-env

          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 60

          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          # verifica se o processo continua aceitando conexoes na porta
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service

metadata:
  name: acta-mongo-api
  labels:
    app.kubernetes.io/name: acta-mongo-api
    app.kubernetes.io/part-of: acta

spec:
  type: ClusterIP

  selector:
    app.kubernetes.io/name: acta-mongo-api

  ports:
    - name: http
      port: 8081
      targetPort: http
      protocol: TCP